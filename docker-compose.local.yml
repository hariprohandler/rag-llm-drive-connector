# Override file for using local PostgreSQL and MongoDB instead of Docker containers
# Usage: docker-compose -f docker-compose.yml -f docker-compose.local.yml up -d
# This file prevents postgres and mongodb from starting when using local databases

version: '3.8'

services:
  # Prevent postgres from starting - use local PostgreSQL instead
  postgres:
    deploy:
      replicas: 0

  # Prevent mongodb from starting - use local MongoDB instead
  mongodb:
    deploy:
      replicas: 0

  app:
    # Run the existing application entrypoint
    command: python app.py
    # Mount source code for live reload
    volumes:
      - .:/app
      - ./data:/app/data:ro
    env_file:
      - .env.development
    environment:
      # Override to use local databases via host.docker.internal
      # On Linux, you may need to use network_mode: host instead
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      - MONGODB_URL=mongodb://host.docker.internal:${MONGODB_PORT:-27017}
      # All other environment variables (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, etc.)
      # are loaded from .env.development via env_file above
    # Note: depends_on from base file remains, but postgres/mongodb won't start due to replicas: 0
    # For Linux, uncomment the line below if host.docker.internal doesn't work:
    # network_mode: host
    # And change DATABASE_URL/MONGODB_URL to use localhost instead of host.docker.internal

  frontend:
    # Mount source code for live reload in development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env.development
    environment:
      # Vite environment variables (must be prefixed with VITE_)
      - VITE_BACKEND_BASE_URL=${VITE_BACKEND_BASE_URL:-http://localhost:8000}
    # Frontend depends on app service
    depends_on:
      - app
