apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-app
  namespace: rag-system
  labels:
    app: rag-llm-drive-connector
    component: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-llm-drive-connector
  template:
    metadata:
      labels:
        app: rag-llm-drive-connector
        component: application
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: rag-app
        image: rag-llm-drive-connector:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        - containerPort: 7860
          name: gradio
          protocol: TCP
        envFrom:
        - configMapRef:
            name: rag-app-config
        - secretRef:
            name: rag-app-secrets
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: rag-app-secrets
              key: DATABASE_URL
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: rag-app-service
  namespace: rag-system
  labels:
    app: rag-llm-drive-connector
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 7860
    targetPort: 7860
    protocol: TCP
    name: gradio
  selector:
    app: rag-llm-drive-connector

