apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-app-config
  namespace: rag-system
  labels:
    app: rag-llm-drive-connector
data:
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "postgres"
  APP_PORT: "8000"
  GRADIO_PORT: "7860"
  HOST: "0.0.0.0"
  PORT: "8000"
  COLLECTION_NAME: "documents"
  CHUNK_SIZE: "1000"
  CHUNK_OVERLAP: "200"
  RETRIEVAL_K: "4"
  LLM_MODEL: "gpt-4o-mini"
  LLM_TEMPERATURE: "0"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"

